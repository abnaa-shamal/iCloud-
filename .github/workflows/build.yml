name: Build signed APK

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      # Firebase settings are kept in GitHub Secrets, never in the repo.
      # The google-services.json is BUILT here from 4 secrets (+ the public project id).
      - name: Write google-services.json files
        env:
          ABNAA_FIREBASE_API_KEY: ${{ secrets.ABNAA_FIREBASE_API_KEY }}
          ABNAA_FIREBASE_SENDER_ID: ${{ secrets.ABNAA_FIREBASE_SENDER_ID }}
          ABNAA_RIDER_APP_ID: ${{ secrets.ABNAA_RIDER_APP_ID }}
          ABNAA_CAPTAIN_APP_ID: ${{ secrets.ABNAA_CAPTAIN_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'shajara-rides-security-t-2632f' }}
        run: |
          for v in ABNAA_FIREBASE_API_KEY ABNAA_FIREBASE_SENDER_ID ABNAA_RIDER_APP_ID ABNAA_CAPTAIN_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing"; exit 1; fi
          done
          python3 - <<'PY'
          import json, os
          e = os.environ
          def client(app_id, pkg):
              return {"client_info": {"mobilesdk_app_id": e[app_id], "android_client_info": {"package_name": pkg}},
                      "api_key": [{"current_key": e["ABNAA_FIREBASE_API_KEY"]}], "services": {}}
          cfg = {"project_info": {"project_number": e["ABNAA_FIREBASE_SENDER_ID"], "project_id": e["FIREBASE_PROJECT_ID"],
                                  "storage_bucket": e["FIREBASE_PROJECT_ID"] + ".firebasestorage.app"},
                 "client": [client("ABNAA_RIDER_APP_ID", "jo.abnaashamal.rider"), client("ABNAA_CAPTAIN_APP_ID", "jo.abnaashamal.Cap")],
                 "configuration_version": "1"}
          json.dump(cfg, open("app/google-services.json", "w"))
          PY
          echo "firebase project: $FIREBASE_PROJECT_ID"

      # Signing key is kept in GitHub Secrets, never in the repo
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          # The admin app uses the same public Firebase settings as the rider app (no extra secret)
          ABNAA_FIREBASE_API_KEY: ${{ secrets.ABNAA_FIREBASE_API_KEY }}
          ABNAA_RIDER_APP_ID: ${{ secrets.ABNAA_RIDER_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'shajara-rides-security-t-2632f' }}
        run: |
          gradle :app:assembleRiderRelease :app:assembleCaptainRelease :admin-app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Short error summary: ONE annotation with the real compiler/Gradle errors (not the task list)
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR=$(grep -E "^e: |^w: .*Unresolved|error:|What went wrong|Execution failed|FAILED|Could not |Caused by" build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 25 | cut -c1-260 | paste -sd '|' -)
            echo "::error title=Build errors::${ERR:-no error lines found}"
          fi

      - name: Publish error log to build-log branch
        if: failure()
        run: |
          if [ -f build.log ]; then
            D=$(mktemp -d)
            grep -E "^e: |error:|What went wrong|Execution failed|Caused by|Unresolved" build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 80 | cut -c1-400 > "$D/errors.txt"
            echo "run ${{ github.run_number }} sha ${{ github.sha }}" >> "$D/errors.txt"
            cd "$D" && git init -q && git checkout -q -b build-log && git config user.name ci && git config user.email ci@example.com
            git add errors.txt && git commit -qm "errors run ${{ github.run_number }}"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
          fi

      - name: Verify signature, package names, version
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          FAIL=0
          check() { # flavor-dir  expected-package
            APK=$(find "app/build/outputs/apk/$1/release" -name '*.apk' 2>/dev/null | head -1)
            if [ -z "$APK" ]; then echo "::error::APK for $1 not found"; FAIL=1; return; fi
            echo "=== $1: $APK"
            "$BT/apksigner" verify --print-certs "$APK" | grep -E "Verifies|SHA-256" || { echo "::error::signature check failed for $1"; FAIL=1; }
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:"
            "$BT/aapt2" dump badging "$APK" | grep -q "name='$2' " || { echo "::error::$1 package name is not $2"; FAIL=1; }
            # The apps must not contain any admin code (the admin is a separate web app)
            if unzip -p "$APK" 'classes*.dex' | strings | grep -E "AdminScreen|RealFirebase|AdminActions|RoyalFooter"; then echo "::error::admin code found in $1 apk"; FAIL=1; else echo "OK: no admin code in $1"; fi
          }
          check rider jo.abnaashamal.rider
          check captain jo.abnaashamal.Cap
          # the admin app
          AAPK=$(find admin-app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$AAPK" ]; then echo "::error::admin APK not found"; FAIL=1; else
            "$BT/apksigner" verify --print-certs "$AAPK" | grep -E "Verifies|SHA-256" || { echo "::error::admin signature check failed"; FAIL=1; }
            "$BT/aapt2" dump badging "$AAPK" | grep -E "^package:|application-label:"
            "$BT/aapt2" dump badging "$AAPK" | grep -q "name='jo.abnaashamal.admin' " || { echo "::error::admin package name wrong"; FAIL=1; }
          fi
          exit $FAIL

      - name: Put the version in the APK file names
        run: |
          for f in rider captain; do
            APK=$(find "app/build/outputs/apk/$f/release" -name '*.apk' | head -1)
            mv "$APK" "app/build/outputs/apk/$f/release/abnaa-$f-1.5.${{ github.run_number }}.apk"
          done

      - name: Put the version in the admin APK name
        run: |
          APK=$(find admin-app/build/outputs/apk/release -name '*.apk' | head -1)
          mv "$APK" "admin-app/build/outputs/apk/release/abnaa-admin-1.0.${{ github.run_number }}.apk"

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json

      - uses: actions/upload-artifact@v5
        with:
          name: shajara-one-rider-apk
          path: app/build/outputs/apk/rider/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: shajara-one-captain-apk
          path: app/build/outputs/apk/captain/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: shajara-admin-apk
          path: admin-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the 3 APKs as a public release so the apps can tell the user "a new version is available"
      - name: Publish release for in-app update check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main = real release (apps offer it as an update). Any other branch = a preview with a tag the updater ignores.
          if [ "${{ github.ref_name }}" = "main" ]; then TAG="build-${{ github.run_number }}"; else TAG="preview-${{ github.ref_name }}-${{ github.run_number }}"; fi
          gh release create "$TAG" \
            app/build/outputs/apk/rider/release/*.apk \
            app/build/outputs/apk/captain/release/*.apk \
            admin-app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "أبناء الشمال ${{ github.run_number }}" --notes "نسخة رقم ${{ github.run_number }}"

      # Fast mirror for slow phones: the rider/captain APKs (never the admin one) go to a single orphan branch that is
      # overwritten every build, and are served through the jsDelivr CDN. The links are printed in the run summary.
      - name: Mirror rider/captain APKs on the CDN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/mirror && cd /tmp/mirror && git init -q -b apk-files
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/rider/release/*.apk abnaa-rider.apk
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/captain/release/*.apk abnaa-captain.apk
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "apk ${{ github.ref_name }} #${{ github.run_number }}"
          SHA=$(git rev-parse HEAD)
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk-files
          {
            echo "### روابط سريعة (CDN)"
            echo "- العميل: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/abnaa-rider.apk"
            echo "- الكابتن: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${SHA}/abnaa-captain.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  # Automatic tests of firestore.rules on a LOCAL emulator (never touches real or test Firebase data)
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Firestore rules
        working-directory: rules-test
        run: |
          node -v
          npm install --no-audit --no-fund
          npm test 2>&1 | tee ../rules-test.log; exit ${PIPESTATUS[0]}

      # Short failure summary as annotations, readable without opening the full log
      - name: Report test failures
        if: failure()
        run: |
          if [ -f rules-test.log ]; then
            # GitHub shows only ~10 annotations, so put ALL failed test names in ONE annotation,
            # and the first error lines of the log in a second one.
            echo "::error title=Failed tests::$(grep -E '^not ok' rules-test.log | sed 's/^not ok [0-9]* - //' | head -n 40 | paste -sd '|' -)"
            echo "::error title=First errors::$(grep -E -A2 '^ +error:' rules-test.log | head -n 30 | tr '\n' ' ' | cut -c1-3000)"
          fi

  # The admin web dashboard must at least build. (The Firebase values are public web settings, not secrets;
  # placeholders are fine here because the build does not contact Firebase.)
  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      # Unit tests of the dashboard's pure logic (stats, search, CSV export); no Firebase, no network
      - run: npm test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || 'ci-placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      # Ready-to-deploy folder for Firebase Hosting (free): public/ = the built dashboard, firebase.json = hosting settings
      - name: Prepare admin-site (Firebase Hosting)
        run: |
          mkdir -p ../admin-site/public
          cp -r dist/* ../admin-site/public/
          printf '%s' '{"hosting":{"public":"public","ignore":["firebase.json","**/.*"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > ../admin-site/firebase.json
      - uses: actions/upload-artifact@v5
        with:
          name: admin-site
          path: admin-site

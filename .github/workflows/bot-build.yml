name: Build bot (lab)

# Builds the separate "Abo-tala Assistant" app that lives in the abnaa-bot/ folder.
# Manual only. It makes NO release (so it can never disturb the apps' update checks).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: abnaa-bot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR=$(grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Could not |Caused by" build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 25 | cut -c1-260 | paste -sd '|' -)
            echo "::error title=Bot build errors::${ERR:-no error lines found}"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: abnaa-bot-apk
          path: abnaa-bot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

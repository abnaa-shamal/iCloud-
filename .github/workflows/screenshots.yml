name: Design screenshots

on:
  workflow_dispatch:
  push:
    branches: [redesign, redesign-road, redesign-night, redesign-aurora, aurora-ready, verify-gate, aurora-merge, neon-app, neon-options]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"
      - name: Arabic fonts for rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core fonts-noto-color-emoji
      # Placeholder Firebase file: the tests never talk to Firebase, the plugin only needs the file to exist.
      - name: Placeholder google-services.json
        run: |
          python3 - <<'PY'
          import json
          def c(pkg): return {"client_info": {"mobilesdk_app_id": "1:1:android:1", "android_client_info": {"package_name": pkg}}, "api_key": [{"current_key": "x"}], "services": {}}
          json.dump({"project_info": {"project_number": "1", "project_id": "demo", "storage_bucket": "demo.appspot.com"},
                     "client": [c("jo.abnaashamal.rider"), c("jo.abnaashamal.Cap")], "configuration_version": "1"}, open("app/google-services.json", "w"))
          PY
      - name: Render screenshots
        run: gradle :app:testRiderDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception|Caused by" test.log | head -25 | sed 's/[A-Za-z0-9+\/=]\{40,\}/[redacted]/g' | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: design-screenshots
          path: app/build/design-shots/*.png
          if-no-files-found: warn
      - name: Publish PNGs to branch design-shots
        if: always()
        run: |
          mkdir -p app/build/design-shots
          grep -E "^e: |error:|FAILED|Exception|Caused by" test.log | head -40 > app/build/design-shots/errors.txt || true
          cd app/build/design-shots || exit 0
          git init -q && git checkout -q -b shots
          git config user.name "ci" && git config user.email "ci@example.com"
          git add . && git commit -qm "screenshots from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:refs/heads/design-shots-${{ github.ref_name }}

      - name: Render admin app screenshots
        if: always()
        run: gradle :admin-app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee admin-test.log; exit ${PIPESTATUS[0]}
      - name: Report admin errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception|Caused by" admin-test.log | head -25 | sed 's/[A-Za-z0-9+\/=]\{40,\}/[redacted]/g' | while read -r l; do echo "::error::$l"; done
      - name: Publish admin PNGs to branch design-shots-<branch>-adminapp
        if: always()
        run: |
          cd admin-app/build/design-shots || exit 0
          git init -q && git checkout -q -b shots
          git config user.name "ci" && git config user.email "ci@example.com"
          git add . && git commit -qm "admin app screenshots from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots:refs/heads/design-shots-${{ github.ref_name }}-adminapp
